[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raster2point"
version = "0.1.0"
description = "Deterministic georeferenced raster attribute transfer to point clouds"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "rasterio>=1.3", "affine>=2.4"]

[project.scripts]
raster2point = "raster2point.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
